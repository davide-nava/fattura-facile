# SonarCloud Project Configuration
sonar.projectKey=navasoft_FatturaFacile
sonar.organization=navasoft

# Source directories for Laravel application
sonar.sources=src/laravel/app,src/laravel/config,src/laravel/database,src/laravel/resources,src/laravel/routes

# Test directories
sonar.tests=src/laravel/tests

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=src/laravel/vendor/**,src/laravel/node_modules/**,src/laravel/storage/**,src/laravel/public/build/**,src/laravel/bootstrap/cache/**

# Test exclusions
sonar.test.exclusions=src/laravel/vendor/**,src/laravel/node_modules/**

# PHP Version for analysis
sonar.php.version=8.5