name: CI/CD Quality Gate & Deployment

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

defaults:
  run:
    working-directory: src/FatturaFacile

jobs:
  code-quality:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, bcmath, zip, gd
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: src/FatturaFacile/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('src/FatturaFacile/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run Laravel Pint Code Style Check
        run: ./vendor/bin/pint --test

      - name: Run Composer Security Audit
        run: composer audit

  tests-and-coverage:
    name: Automated Tests & 100% Coverage Verification
    runs-on: ubuntu-latest
    needs: [code-quality]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fatturafacile_test
          POSTGRES_USER: fatturafacile
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP with Coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, bcmath, zip, gd
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: src/FatturaFacile/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('src/FatturaFacile/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify Database Migrations (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fatturafacile_test
          DB_USERNAME: fatturafacile
          DB_PASSWORD: secret_password
        run: php artisan migrate --force

      - name: Execute PHPUnit Suite with Coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          AUTO_MIGRATE: true
        run: php vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text --colors=always

      - name: Verify 100% Code Coverage Gate
        run: |
          php -r '
          $xml = simplexml_load_file("coverage.xml");
          $statements = (int) $xml->project->metrics["statements"];
          $covered = (int) $xml->project->metrics["coveredstatements"];
          $pct = $statements > 0 ? round(($covered / $statements) * 100, 2) : 100;
          echo "Statements Coverage: {$covered} / {$statements} ({$pct}%)\n";
          if ($pct < 100) {
              echo "Error: Code coverage is {$pct}%, strictly below the required 100% threshold!\n";
              exit(1);
          }
          echo "Success: 100% Code Coverage Verified!\n";
          '

      - name: Upload Coverage Clover XML Report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: src/FatturaFacile/coverage.xml
          retention-days: 14

  deploy:
    name: Build & Deployment Gate
    runs-on: ubuntu-latest
    needs: [tests-and-coverage]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Production Docker Image
        run: |
          docker build -t fatturafacile:latest -f Dockerfile .
