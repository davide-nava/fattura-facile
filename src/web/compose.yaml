services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: fatturafacile/app:latest
        container_name: fatturafacile-app
        restart: unless-stopped
        working_dir: /var/www/html
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            APP_NAME: Fattura Facile
            APP_ENV: production
            APP_DEBUG: "false"
            APP_URL: http://localhost:8080

            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: fatturafacile
            DB_USERNAME: fatturafacile
            DB_PASSWORD: ${DB_PASSWORD:-secret}

            REDIS_HOST: redis
            REDIS_PORT: 6379

            CACHE_STORE: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis

        volumes:
            - storage_data:/var/www/html/storage

        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

        networks:
            - fatturafacile-net

    web:
        image: nginx:1.27-alpine
        container_name: fatturafacile-web
        restart: unless-stopped
        ports:
            - "8080:80"

        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
            - storage_data:/var/www/html/storage:ro

        depends_on:
            - app

        networks:
            - fatturafacile-net

    queue:
        image: fatturafacile/app:latest
        container_name: fatturafacile-queue
        restart: unless-stopped
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

        environment:
            APP_NAME: Fattura Facile
            APP_ENV: production

            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: fatturafacile
            DB_USERNAME: fatturafacile
            DB_PASSWORD: ${DB_PASSWORD:-secret}

            REDIS_HOST: redis
            REDIS_PORT: 6379
            QUEUE_CONNECTION: redis

        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

        networks:
            - fatturafacile-net

    scheduler:
        image: fatturafacile/app:latest
        container_name: fatturafacile-scheduler
        restart: unless-stopped
        command: php artisan schedule:work

        environment:
            APP_NAME: Fattura Facile
            APP_ENV: production

            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: fatturafacile
            DB_USERNAME: fatturafacile
            DB_PASSWORD: ${DB_PASSWORD:-secret}

            REDIS_HOST: redis
            REDIS_PORT: 6379

        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

        networks:
            - fatturafacile-net

    postgres:
        image: postgres:16-alpine
        container_name: fatturafacile-postgres
        restart: unless-stopped

        ports:
            - "5432:5432"

        environment:
            POSTGRES_DB: fatturafacile
            POSTGRES_USER: fatturafacile
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}

        volumes:
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U fatturafacile -d fatturafacile"]
            interval: 5s
            timeout: 5s
            retries: 5

        networks:
            - fatturafacile-net

    redis:
        image: redis:7-alpine
        container_name: fatturafacile-redis
        restart: unless-stopped

        ports:
            - "6379:6379"

        volumes:
            - redis_data:/data

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

        networks:
            - fatturafacile-net

    mailpit:
        image: axllent/mailpit:latest
        container_name: fatturafacile-mailpit
        restart: unless-stopped

        ports:
            - "1025:1025"
            - "8025:8025"

        networks:
            - fatturafacile-net

    selenium:
        image: selenium/standalone-chromium
        container_name: fatturafacile-selenium
        restart: unless-stopped

        extra_hosts:
            - "host.docker.internal:host-gateway"

        volumes:
            - /dev/shm:/dev/shm

        networks:
            - fatturafacile-net

volumes:
    postgres_data:
    redis_data:
    storage_data:

networks:
    fatturafacile-net:
        driver: bridge
